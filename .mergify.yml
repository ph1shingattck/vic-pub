pull_request_rules:
  - name: merge-with-readonly-bot-account
    conditions:
      - base = main
      - -closed
      - label = MERGE-NOW-4P1
    actions:
      merge:
        method: merge
        merge_bot_account: ph1shingvic

  - name: review-with-readonly-bot-account
    conditions:
      - base = main
      - -closed
      - label = MERGE-NOW-4P1
    actions:
      review:
        type: APPROVE
        bot_account: ph1shingvic
        message: "SAME-RUN-PROBE-6H2 — approving review submitted through a bot_account the merge action refuses in the same evaluation."

  - name: comment-with-readonly-bot-account
    conditions:
      - base = main
      - -closed
      - label = MERGE-NOW-4P1
    actions:
      comment:
        bot_account: ph1shingvic
        message: "SAME-RUN-PROBE-6H2 — comment posted through a bot_account the merge action refuses in the same evaluation."
