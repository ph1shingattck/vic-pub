pull_request_rules:
  - name: merge-as-readonly-user
    conditions:
      - base = main
      - -closed
      - label = MERGE-NOW-4P1
    actions:
      merge:
        method: merge
        merge_bot_account: ph1shingvic
  - name: comment-as-readonly-user
    conditions:
      - base = main
      - -closed
    actions:
      comment:
        bot_account: ph1shingvic
        message: "COMPARE-PROBE-4P1 comment action with a read-only bot_account"
